# Keeps the SHA-pinned actions in .github/workflows/ up to date. The script itself has no dependencies
# (Python standard library only), so GitHub Actions is the only ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so that a compromised or broken release is likely
    # to be noticed and withdrawn first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
