name: Tests

# The required checks. They run on Linux, where runners are always available; the code uses only the
# standard library, and the few macOS-specific paths are simulated in the tests. The run with macOS's own
# Python is in test-macos.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "3.9"          # the oldest supported version (README: Requirements)
            python: "3.9"
          - name: "3 (latest)"
            python: "3.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the tests
        run: |
          python3 --version
          python3 -B -m unittest discover -s tests -v
